name: holom-core CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: |
          pytest -v

  audit-and-packaging:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package, audit, and packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build twine

      - name: Run critical static checks
        run: |
          ruff check src tests audit --select E9,F63,F7,F82

      - name: Run test suite with coverage
        run: |
          pytest --cov=holom --cov-report=term-missing

      - name: Run standalone audit smoke suite
        run: |
          python audit/run_audit.py
          python audit/compare_zero_order_real.py
          python audit/validate_legacy.py

      - name: Build and verify sdist and wheel
        run: |
          python -m build
          twine check dist/*
